# The composition row for dsh-sidebar, for reference.
#
# You do NOT add this row by hand. `package.json` declares
#   "dsh": { "bundle": { "patch": "./cordis.patch.yml" } }
# and DSH applies that patch file for every entry of `dsh.profile.bundles`. So
#   dsh plugin --profile web add dsh-sidebar
# is the whole install: it lists the bundle, and the bundle inserts this row.
#
# Do not append this row to $DSH_HOME/profiles/web/cordis.patch.yml either. The
# bundle patch already inserts it, and a second insert gives the loader two
# entries with the id `sidebar`. The loader refuses a duplicate entry id with
# "duplicate loader entry id: sidebar", and the profile will not boot.
#
# To check the row is composed: dsh --profile web --dump-config
# To uninstall:                dsh plugin --profile web remove dsh-sidebar

- insert:
    - id: sidebar
      name: 'dsh-sidebar'
